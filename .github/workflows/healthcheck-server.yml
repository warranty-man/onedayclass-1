name: Server health check

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        id: ping
        run: |
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -m 10 http://warranty-man.com)
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 400 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== debug: GITHUB_OUTPUT raw ==="
          cat "$GITHUB_OUTPUT"

      - name: Create issue on failure
        if: ${{ steps.ping.outputs.ok == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "서버 응답 없음: http://warranty-man.com (${{ github.run_id }})" \
            --body "ICMP ping에 실패했습니다.\n\n- URL: \`http://warranty-man.com\`"
